name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@27848deafe626b280ed329bf98eff2f01631a764
        with:
          version: 0.11.196
          install: false

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build actual package artifacts
        run: bun run build

      - name: Verify strict installed Result package
        run: bun run test:package

      - name: Publish verified payload to Pantry
        run: pantry publish --verify-existing
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}

      - name: Publish
        run: pantry publish --npm --access public --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
